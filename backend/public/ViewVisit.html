   <form action="/api/visits" method="GET">

</form>

    <hr>

    <!-- 🔹 BACKEND WILL RENDER VISITS HERE -->

    <ul>
      <li>
        <b>Location Name</b><br>
        Check-in: 2025-01-01 10:00<br>
        Check-out: 2025-01-01 12:00

        <form action="/visits/delete" method="POST" style="display:inline;">
          <input type="hidden" name="visit_id" value="1">

        </form>

        <!-- 🔸 UPDATE FORM -->
        <form action="/visits/update" method="POST" style="display:inline;">
          <input type="hidden" name="visit_id" value="1">
