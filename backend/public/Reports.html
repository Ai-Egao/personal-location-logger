<!DOCTYPE html>
<html>
<head>
  <title>Reports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="visit.html">Add Visit</a>
  <a href="view_visits.html">View Visits</a>
  <a href="reports.html" class="active">Reports</a>
</nav>

<div class="container">
  <h2>Reports</h2>

  <div class="card">

    <!-- 🔹 REPORT SELECTION FORM -->
    <form action="/reports" method="GET">
      <label>Select Report Type:</label><br><br>

      <select name="type" required>
        <option value="">-- Select --</option>
        <option value="most-visited">Most Visited Locations</option>
        <option value="time-spent">Time Spent</option>
      </select>

      <br><br>
      <button type="submit">Generate Report</button>
    </form>

  </div>

  <!-- 🔹 BACKEND WILL RENDER RESULTS BELOW -->

  <div class="card">
    <h3>Report Result</h3>

    <!-- Example static structure -->
    <ul>
      <li>Location A - 5 visits</li>
      <li>Location B - 120 mins</li>
    </ul>

  </div>

</div>

</body>
</html>
